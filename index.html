<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('parable-theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Parable — a sanctuary for youth faith questions</title>
    <meta
      name="description"
      content="A safe space for youth faith questions, daily verses, prayer and outreach for local churches in Laguna, Philippines."
    />
    <meta property="og:title" content="Parable — a sanctuary for youth faith questions" />
    <meta
      property="og:description"
      content="A safe space for youth faith questions, daily verses, prayer and outreach for local churches in Laguna, Philippines."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
